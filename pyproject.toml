[project]
name = "airquality"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "folium>=0.12",
    "geopandas>=1.1.2",
    "mapclassify>=2.10.0",
    "matplotlib>=3.10.8",
    "pandas>=3.0.0",
    "pyspark>=4.1.1",
    "requests>=2.32.5",
    "ruff>=0.15.0",
    "tensorboard>=2.20.0",
    "torch>=2.10.0",
    "torchvision>=0.24.1",
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [
  { index = "pytorch-cpu" },
]
torchvision = [
  { index = "pytorch-cpu" },
]
